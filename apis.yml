aid: adaptive-insurance
name: Adaptive Insurance
description: >-
  Adaptive Insurance is an Austin, Texas managing general agent and insurtech platform
  founded in 2024 by former Hippo executives Mike Gulla and Arik Yelovitch, writing
  parametric and specialty coverage for climate and weather risk in the United States.
  Its flagship product, GridProtect, is a parametric power-outage policy that pays
  automatically on a verified third-party outage trigger, typically within days; the
  portfolio also includes residential and commercial wind/hail deductible buy-backs,
  standalone residential flood coverage, equipment breakdown, and a Restaurant Recovery
  product offered by Tokio Marine HCC and powered by Adaptive. Distribution runs through
  appointed agents and brokers who quote, bind and issue online in under five minutes in
  a portal backed by the company's own identity tenant, plus embedded and white-label
  partner arrangements. Adaptive publishes no public developer program - no portal,
  reference, or machine-readable specification - so this profile records the identity and
  discovery surface it does serve.
